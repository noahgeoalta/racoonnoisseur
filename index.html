<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Raccoonnoisseur — House Menu Trainer</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raccoonnoisseur">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b1714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate-overlay" id="gate-overlay">
  <div class="gate-card">
    <img class="gate-logo" src="img/logo.webp" alt="Raccoonnoisseur" width="260" height="256">
    <h2 class="sr-only">Raccoonnoisseur</h2>
    <p>Private study tool — enter the shared password to continue.</p>
    <input type="password" id="gate-input" class="search-input" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off">
    <button class="btn block" id="gate-submit">Unlock</button>
    <p class="gate-error" id="gate-error"></p>
  </div>
  <div class="walker walker-loop" aria-hidden="true"></div>
</div>

<header class="app-header">
  <div class="brand">
    <button class="brand-avatar" id="brand-avatar" aria-label="Say hi"><img src="img/face-happy.webp" alt="" width="44" height="44"></button>
    <div class="brand-text">
      <h1>Raccoonnoisseur</h1>
      <p>House menu trainer</p>
    </div>
  </div>
</header>

<main id="view-root" class="view-root"></main>

<nav class="tab-bar" id="tab-bar">
  <button class="tab-btn" data-view="study" aria-label="Study">
    <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2"/><path d="M5 6.5v12A2.5 2.5 0 0 0 7.5 21H15"/><path d="M13 8l-2 3h4l-2 3"/></svg></span><span>Study</span>
  </button>
  <button class="tab-btn" data-view="quiz" aria-label="Quiz">
    <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17" r=".6"/></svg></span><span>Quiz</span>
  </button>
  <button class="tab-btn" data-view="guest" aria-label="Guest questions">
    <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></span><span>Guests</span>
  </button>
  <button class="tab-btn" data-view="review" aria-label="Review">
    <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span><span>Review</span>
  </button>
  <button class="tab-btn" data-view="reference" aria-label="Reference">
    <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5c3-1.5 6-1.5 9 1 3-2.5 6-2.5 9-1v14c-3-1.5-6-1.5-9 1-3-2.5-6-2.5-9-1z"/><path d="M12 6v14"/></svg></span><span>Reference</span>
  </button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
