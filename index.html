<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Raccoonnoisseur — House Menu Trainer</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raccoonnoisseur">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b1714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate-overlay" id="gate-overlay">
  <div class="gate-card">
    <img class="gate-logo" src="img/logo.webp" alt="Raccoonnoisseur" width="260" height="256">
    <h2 class="sr-only">Raccoonnoisseur</h2>
    <p>Private study tool — enter the shared password to continue.</p>
    <input type="password" id="gate-input" class="search-input" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off">
    <button class="btn block" id="gate-submit">Unlock</button>
    <p class="gate-error" id="gate-error"></p>
  </div>
  <div class="walker walker-loop" aria-hidden="true"></div>
</div>

<header class="app-header">
  <div class="brand">
    <button class="brand-avatar" id="brand-avatar" aria-label="Say hi"><img src="img/face-happy.webp" alt="" width="44" height="44"></button>
    <div class="brand-text">
      <h1>Raccoonnoisseur</h1>
      <p>House menu trainer</p>
    </div>
  </div>
</header>

<main id="view-root" class="view-root"></main>

<nav class="tab-bar" id="tab-bar">
  <button class="tab-btn" data-view="study" aria-label="Study">
    <span class="tab-icon">🃏</span><span>Study</span>
  </button>
  <button class="tab-btn" data-view="quiz" aria-label="Quiz">
    <span class="tab-icon">❓</span><span>Quiz</span>
  </button>
  <button class="tab-btn" data-view="review" aria-label="Review">
    <span class="tab-icon">🎯</span><span>Review</span>
  </button>
  <button class="tab-btn" data-view="reference" aria-label="Reference">
    <span class="tab-icon">📖</span><span>Reference</span>
  </button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
